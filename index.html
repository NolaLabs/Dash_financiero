<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Nola Labs · Tablero Financiero</title>
<meta name="description" content="Tablero financiero corporativo y personal — Nola Labs" />
<meta name="theme-color" content="#F0EDE5" />
<!-- Content Security Policy: solo scripts propios (supabase-js vendorizado), conexión únicamente a la nube del tablero -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://baqevhsyawugvekqbwsm.supabase.co wss://baqevhsyawugvekqbwsm.supabase.co; frame-src https://challenges.cloudflare.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 20 L80 80 L64 80 L50 50 L36 80 L20 80 Z' fill='%23004643'/%3E%3Ccircle cx='86' cy='74' r='7' fill='%237ED3B2'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@400;600;700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=6" />
</head>
<body>

<!-- ====================================================== LOCK SCREEN -->
<div id="lock">
  <div class="lock-card">
    <img class="lock-iso" src="assets/nola-isotipo.png" alt="Nola Labs" />
    <h1>Tablero</h1>
    <div class="lock-sub" id="lockSub">Finanzas corporativas y personales</div>
    <div class="lock-tag">FÁCIL EXPERIMENTACIÓN, RÁPIDA EJECUCIÓN.</div>

    <form id="lockForm" autocomplete="off">
      <div class="field" id="emailField" hidden>
        <label for="lockEmail">Correo</label>
        <input type="email" id="lockEmail" placeholder="tu correo" autocomplete="username" />
      </div>
      <div class="field" id="keyField">
        <label for="lockKey" id="keyLabel">Clave de acceso</label>
        <input type="password" id="lockKey" placeholder="••••••••" autocomplete="current-password" autofocus />
      </div>
      <div class="field" id="mfaField" hidden>
        <label for="lockCode">Código de verificación (app de autenticación)</label>
        <input type="text" id="lockCode" inputmode="numeric" autocomplete="one-time-code" placeholder="123456" maxlength="6" />
      </div>
      <div id="captcha"></div>
      <div class="lock-err" id="lockErr"></div>
      <button class="btn btn--primary btn--full" type="submit" id="lockBtn">Entrar</button>
    </form>
    <div class="lock-or" id="lockOr" hidden><span>o</span></div>
    <button type="button" class="btn btn--ghost btn--full lock-google" id="googleBtn" hidden>
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M21.6 12.23c0-.68-.06-1.36-.19-2.02H12v3.83h5.4a4.6 4.6 0 0 1-2 3.02v2.5h3.23c1.9-1.75 2.97-4.32 2.97-7.33z"/><path fill="#34A853" d="M12 22c2.7 0 4.97-.9 6.63-2.43l-3.23-2.5c-.9.6-2.04.96-3.4.96-2.61 0-4.82-1.76-5.61-4.13H3.05v2.58A10 10 0 0 0 12 22z"/><path fill="#FBBC05" d="M6.39 13.9a6 6 0 0 1 0-3.8V7.52H3.05a10 10 0 0 0 0 8.96l3.34-2.58z"/><path fill="#EA4335" d="M12 5.97c1.47 0 2.79.5 3.83 1.5l2.86-2.86A9.98 9.98 0 0 0 12 2a10 10 0 0 0-8.95 5.52l3.34 2.58C7.18 7.73 9.39 5.97 12 5.97z"/></svg>
      Continuar con Google
    </button>
    <div class="lock-hint" id="googleHint" hidden>Usá el mismo correo de tu cuenta del tablero: Google entra a la misma cuenta.</div>
    <div class="lock-mode" id="lockMode"></div>
  </div>
</div>

<!-- ====================================================== APP -->
<div id="app">

  <!-- Barra superior flotante: marca + estado -->
  <header class="fbar" id="fbar">
    <a class="brand" data-go="resumen" href="#" aria-label="Ir al resumen">
      <img src="assets/nola-isotipo.png" alt="" />
      <span class="brand-nm">Nola Labs<span class="dot">•</span></span>
      <span class="brand-sub">Tablero financiero</span>
    </a>
    <div class="fbar-right">
      <span class="tb-status"><span class="tb-dot off" id="cloudDot"></span><span id="cloudLabel">Local</span></span>
      <span class="tb-save" id="saveLabel"></span>
      <button class="btn btn--ghost btn--sm" id="logoutBtn">Salir</button>
    </div>
  </header>

  <!-- Navegación flotante (dock) -->
  <nav class="fnav" id="fnav" aria-label="Navegación principal">
    <span class="fnav-ind" id="fnavInd" aria-hidden="true"></span>
    <button class="fnav-item active" data-view="resumen" data-mobile="1" title="Resumen">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      <span class="fl">Resumen</span></button>
    <button class="fnav-item" data-view="empresa" title="Empresa">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12h18"/></svg>
      <span class="fl">Empresa</span></button>
    <button class="fnav-item" data-view="personal" title="Personal">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
      <span class="fl">Personal</span></button>
    <button class="fnav-item" data-view="pagos" data-mobile="1" title="Pagos del mes">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="m8 12 3 3 5-6"/></svg>
      <span class="fl">Pagos</span></button>
    <button class="fnav-item" data-view="movimientos" data-mobile="1" title="Movimientos">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg>
      <span class="fl">Movimientos</span></button>
    <button class="fnav-item" data-view="equipo" title="Equipo">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-4.5-6.2"/></svg>
      <span class="fl">Equipo</span></button>
    <button class="fnav-item" data-view="renta" title="Renta">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>
      <span class="fl">Renta</span></button>
    <button class="fnav-item fnav-more" id="fnavMore" data-mobile="1" title="Más" aria-haspopup="true" aria-expanded="false">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18" cy="12" r="1.6"/></svg>
      <span class="fl">Más</span></button>
    <button class="fnav-item fnav-bell" data-view="alertas" data-mobile="1" title="Alertas">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21a2 2 0 0 0 4 0"/></svg>
      <span class="fl">Alertas</span><span class="nbadge" id="alertBadge" hidden>0</span></button>
  </nav>

  <!-- Menú secundario del dock -->
  <div class="fmenu" id="fmenu" hidden role="menu">
    <button class="fmenu-item" data-view="empresa" role="menuitem"><span class="fm-ic">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12h18"/></svg></span><span><b>Empresa</b><small>P&amp;L recurrente, equilibrio, meta</small></span></button>
    <button class="fmenu-item" data-view="personal" role="menuitem"><span class="fm-ic">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span><span><b>Personal</b><small>Tu presupuesto y runway</small></span></button>
    <button class="fmenu-item" data-view="equipo" role="menuitem"><span class="fm-ic">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-4.5-6.2"/></svg></span><span><b>Equipo</b><small>Cuentas de cobro y planillas</small></span></button>
    <button class="fmenu-item" data-view="pila" role="menuitem"><span class="fm-ic">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/></svg></span><span><b>Seguridad social</b><small>Tus planillas PILA por mes</small></span></button>
    <button class="fmenu-item" data-view="renta" role="menuitem"><span class="fm-ic">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg></span><span><b>Renta</b><small>Documentos por año gravable</small></span></button>
    <button class="fmenu-item" data-view="salud" role="menuitem"><span class="fm-ic">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/></svg></span><span><b>Salud financiera</b><small>Scoring 0–100 empresa y personal</small></span></button>
    <button class="fmenu-item" data-view="proyecciones" role="menuitem"><span class="fm-ic">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg></span><span><b>Proyecciones</b><small>Palancas a 12 meses</small></span></button>
    <button class="fmenu-item" data-view="editor" role="menuitem"><span class="fm-ic">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4l10-10-4-4L4 16z"/><path d="m13 7 4 4"/></svg></span><span><b>Datos · Editar</b><small>Todo lo editable en un lugar</small></span></button>
    <button class="fmenu-item" data-view="ajustes" role="menuitem"><span class="fm-ic">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18a4 4 0 0 1-.5-8A6 6 0 0 1 18 9a4 4 0 0 1 0 9z"/></svg></span><span><b>Nube · Ajustes</b><small>Sincronización y respaldo</small></span></button>
  </div>
  <div class="scrim" id="scrim"></div>

  <!-- MAIN -->
  <main class="main">
    <section class="view active" id="view-resumen"></section>
    <section class="view" id="view-empresa"></section>
    <section class="view" id="view-personal"></section>
    <section class="view" id="view-pagos"></section>
    <section class="view" id="view-movimientos"></section>
    <section class="view" id="view-equipo"></section>
    <section class="view" id="view-pila"></section>
    <section class="view" id="view-renta"></section>
    <section class="view" id="view-alertas"></section>
    <section class="view" id="view-salud"></section>
    <section class="view" id="view-proyecciones"></section>
    <section class="view" id="view-editor"></section>
    <section class="view" id="view-ajustes"></section>
    <footer class="foot">
      <span class="foot-brand">Nola Labs<span class="dot">•</span></span>
      <span class="foot-tag">Fácil experimentación, rápida ejecución.</span>
      <span class="foot-meta" id="footMeta">Pesos colombianos (COP)</span>
    </footer>
  </main>
</div>

<div class="chart-tip" id="tip"></div>
<div id="toast"></div>
<input type="file" id="docFile" hidden accept=".pdf,.png,.jpg,.jpeg,.webp,.xlsx,.docx,.csv,application/pdf,image/*" />
<input type="file" id="bankFile" hidden accept=".xlsx,.pdf" multiple />
<input type="file" id="bulkFiles" hidden webkitdirectory multiple />

<script src="vendor/supabase.js?v=2.116.0"></script>
<script src="motion.js?v=4"></script>
<script src="app.js?v=7"></script>
<script src="modules.js?v=9"></script>
<script src="bank.js?v=10"></script>
</body>
</html>
